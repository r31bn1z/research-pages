<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="調査結果を外出先から読むためのレポート一覧">
  <title>Research Pages</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <p class="eyebrow">Research archive</p>
    <h1>Research Pages</h1>
    <p class="lede">調べたことを、あとから読み返せる形に。</p>
  </header>
  <main>
    <h2>レポート</h2>
    <p>新しいレポートは、ここに日付の新しい順で追加されます。</p>
    <ul class="report-list">
      <li>
        <strong>まだレポートはありません</strong>
        <p>最初の調査が公開されると、ここから読めるようになります。</p>
      </li>
    </ul>
  </main>
  <footer>内容は各レポートの調査基準日時点の情報です。重要な判断では最新の一次情報も確認してください。</footer>
</body>
</html>
